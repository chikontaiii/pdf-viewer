<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>АЛИМБЕКОВ ЗАИРБЕК ТИЛЕБЕРДИЕВИЧ</title>
  <style>
    html,body { height:100%; margin:0; }
    .pdfwrap { height:100vh; display:flex; flex-direction:column; }
    .topbar { padding:8px; background:#111; color:#fff; display:flex; gap:8px; align-items:center; }
    .viewer { flex:1; }
    iframe,embed,object { width:100%; height:100%; border:0; }
    .actions { margin-left:auto; }
  </style>
</head>
<body>
  <div class="pdfwrap">
    <div class="topbar">
      <strong>Документ</strong>
      <div class="actions">
        <a href="АЛИМБЕКОВ ЗАИРБЕК ТИЛЕБЕРДИЕВИЧ.pdf" download>Скачать PDF</a>
      </div>
    </div>

    <!-- Либо iframe, либо object/embed — оба нормально -->
    <div class="viewer">
      <iframe src="АЛИМБЕКОВ ЗАИРБЕК ТИЛЕБЕРДИЕВИЧ.pdf"></iframe>
    </div>
  </div>
</body>
</html>
